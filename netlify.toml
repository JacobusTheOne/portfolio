# Static site: no build step. Only the site/ folder is published
# (contact-api/ is the AWS backend source and must never be served).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src allows the contact form API only. Update it if the API URL changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https://vrlo92aei2.execute-api.us-east-2.amazonaws.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
